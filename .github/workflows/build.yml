name: Build
# Build the public client independently; no private checkout is required.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        shell: bash
        run: ./gradlew --no-daemon build spotlessCheck :client-mod:prepareDemoMods
      - name: Verify public package boundaries
        shell: bash
        run: python -m unittest discover -s tools -p "test_package*.py"
      - name: Package public Prism instance
        shell: bash
        run: python tools/package_client.py --output dist/AncientRPG-client-prism.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ancientrpg-client-${{ runner.os }}
          path: |
            dist/AncientRPG-client-prism.zip
            dist/AncientRPG-client-prism.zip.sha256
          if-no-files-found: error
